features:
  - feature_id: select_family
    category: select
    min_version: "5.7.0"
    ast_nodes: [query_expression, query_specification]
    guards: [read_only_select, shallow_complexity, stable_ordering]
    profiles: [regular_innodb]
    weight: 12
    evidence:
      - {source_id: grammar_8041, locator: query_expression}
      - {source_id: parse_tree_8041, locator: pt_query_specification}
    variants:
      - variant_id: select_query_specification
        min_version: "5.7.0"
        ast_nodes: [query_expression, query_specification, predicate_expression]
        guards: [read_only_select, bounded_cardinality, stable_ordering]
        profiles: [regular_innodb]
        weight: 10
        evidence:
          - {source_id: grammar_8041, locator: query_specification}
      - variant_id: select_parenthesized
        min_version: "8.0.22"
        ast_nodes: [query_expression, parenthesized_query_expression]
        guards: [read_only_select, shallow_complexity, stable_ordering]
        profiles: [regular_innodb]
        weight: 2
        evidence:
          - {source_id: grammar_8041, locator: query_expression_parens}
          - {source_id: release_8022, locator: parenthesized_query_expressions}

  - feature_id: join_family
    category: join
