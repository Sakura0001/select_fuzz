raw_web_sql_policy: signatures_only_never_execute
checked_at: "2026-07-12"

guard_definitions:
  - alias_required
  - arity_equal
  - bounded_cardinality
  - bounded_recursion
  - compatible_collation
  - compatible_types
  - config_fingerprint_equal
  - deterministic_expression
  - exact_grouping
  - existing_index
  - existing_partition
  - fixed_srid
  - foreign_key_compatible
  - frame_bounds_valid
  - fulltext_compatible
  - json_path_valid
  - lateral_direction_valid
  - multivalue_compatible
  - no_duplicate_json_keys
  - no_external_json_ref
  - no_nondeterministic_function
  - no_unsupported_window_clause
  - only_full_group_by_legal
  - partition_unique_key_complete
  - read_only_select
  - same_session
  - scalar_cardinality
  - shallow_complexity
  - stable_ordering
  - termination_predicate
  - version_available

profile_definitions:
  - foreign_key_graph
  - fulltext_innodb
  - json_multivalue_innodb
  - partitioned_innodb
  - regular_innodb
  - spatial_innodb
  - temporary_innodb

