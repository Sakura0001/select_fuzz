# 内网主备集群的 fuzz 示例配置。
# 使用前复制为 config/intranet-fuzz.yaml；以后只需要修改下面两行 host。
# 密码只通过环境变量提供，不要写入本文件。
mode: fuzz
full_thread_sql_log: false
replica_parameters_file: null
replica_sync_timeout_seconds: 10

# fuzz 只使用 fuzz.target_role 指定的节点。固定三角色字段用于兼容现有配置模型；
# 三个角色通过 YAML 锚点复用同一组主备地址，所以只需要维护两行 IP。
nodes:
  - role: baseline
    primary: &fuzz_primary
      # 主节点 IP：writer 全部连接这里，1/3 reader 也连接这里。
      host: 10.0.0.10
      port: 3306
      username_env: SELECT_FUZZ_MYSQL_USER
      password_env: SELECT_FUZZ_MYSQL_PASSWORD
    replica: &fuzz_replica
      # 备节点 IP：2/3 reader 连接这里。
      host: 10.0.0.11
      port: 3306
      username_env: SELECT_FUZZ_MYSQL_USER
      password_env: SELECT_FUZZ_MYSQL_PASSWORD
  - role: custom_off
    primary: *fuzz_primary
    replica: *fuzz_replica
  - role: custom_on
    primary: *fuzz_primary
    replica: *fuzz_replica

fuzz:
  target_role: custom_on
  databases: 12
  writer_threads_per_database: 4
  reader_threads_per_database: 12
  max_total_connections: 1024
  initial_tables: 8
  initial_rows_per_table: 1000
  max_rows_per_database: 100000
  min_columns_per_table: 200
  max_columns_per_table: 500
  min_indexes_per_table: 4
  max_indexes_per_table: 12
  query_timeout_seconds: 30
  batch_rows_min: 100
  batch_rows_max: 1000
  delete_batch_rows_min: 10
  delete_batch_rows_max: 50
  insert_weight: 35
  update_weight: 45
  delete_weight: 10
  upsert_weight: 10
  grammar_query_weight: 50
  load_shaped_query_weight: 50
  query_generator_processes: 0
  # 每 30 分钟停掉旧批次连接，再并发创建全新的 databases 批次；旧库始终保留。
  schema_refresh_interval_seconds: 1800
  connector_implementation: auto
  control_connection_reserve: 8
  query_kill_grace_seconds: 1
  reconnect_initial_delay_seconds: 0.25
  reconnect_max_delay_seconds: 10
