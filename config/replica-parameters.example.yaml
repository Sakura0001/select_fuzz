# 副本会话参数文件版本；当前只能为 1。
version: 1

# 三个副本角色必须各出现一次；参数值仅保留配置记录，不在测试时下发 SET SESSION。
# 数据库运行参数请预先配置，程序直接使用各 endpoint 的现有值。
replicas:
  # baseline 副本的参数记录。
  baseline:
    # MySQL SESSION 变量映射；默认空。变量名必须是安全标识符，值只能是 bool/int/float/string。
    session_variables: {}
  # custom_off 副本的参数记录；PQ 等开关应已在测试前关闭。
  custom_off:
    # MySQL SESSION 变量映射；默认空。例如：optimizer_switch: "hash_join=off"。
    session_variables: {}
  # custom_on 副本的参数记录；PQ 等开关应已在测试前开启。
  custom_on:
    # MySQL SESSION 变量映射；默认空。例如：optimizer_switch: "hash_join=on"。
    session_variables: {}
