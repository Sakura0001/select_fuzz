[project]
name = "select-fuzz"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "mysql-connector-python>=9.0,<10",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
select-fuzz = "select_fuzz.cli:app"

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "hypothesis>=6.100",
  "httpx>=0.27,<1",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "types-PyYAML>=6.0.12,<7",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/.git",
  "/.hypothesis",
  "/.local",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.uv-cache",
  "/.venv",
  "/.worktrees",
  "/artifacts",
  "/dist",
  "/htmlcov",
  "/reports",
  "**/__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["src/select_fuzz"]

[tool.hatch.build.targets.wheel.force-include]
"catalog/mysql-8.0.41-query-shapes.yaml" = "select_fuzz/data/mysql-8.0.41-query-shapes.yaml"
"catalog/mysql-8.0.22-select.grammar.yy" = "select_fuzz/data/mysql-8.0.22-select.grammar.yy"

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/.python-version",
  "/catalog",
  "/config/example.yaml",
  "/config/replica-parameters.example.yaml",
  "/docs/research",
  "/docs/superpowers/plans",
  "/docs/testing",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mysql: real MySQL integration",
  "mysql_performance: two-instance MySQL 8.0.22 performance integration",
  "online: opt-in checks that fetch immutable official sources",
  "soak: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["select_fuzz"]
