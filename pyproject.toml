[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "select-fuzz"
version = "0.1.0"
description = "面向 MySQL 8.0.22 的 SQL 模糊测试工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "PyYAML>=6.0",
  "PyMySQL>=1.1",
  "sshtunnel>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["select_fuzz*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
